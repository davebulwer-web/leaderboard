// ---- world.js ----
// Turns one generated hole into a world the 3D view can draw quickly: a grid,
// one yard to a cell, of what the ground is and how high it is, plus every
// tree and bush standing on it. Hole coordinates are the generator's: yards,
// tee at (0, 0), playing up +y, with +x to the golfer's right.


const SURF_NAMES = ['trees', 'rough', 'fairway', 'fringe', 'green', 'tee', 'bunker', 'water', 'waste', 'copse', 'sea', 'beach', 'oob'];
const SURF_INDEX = Object.fromEntries(SURF_NAMES.map((n, i) => [n, i]));
const S_OOB = SURF_INDEX.oob;
// What a drawn surface plays as.
const PLAYS_AS = { copse: 'trees', sea: 'water', beach: 'bunker' };

const MARGIN = 45; // yards of woods kept round the hole
const TREE_STEP = 5; // yards between places a tree may stand

function hash2(i, j, k = 0) {
  let h = Math.imul(i, 374761393) + Math.imul(j, 668265263) + Math.imul(k, 2246822519);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

function pickWeighted(list, u) {
  const total = list.reduce((t, e) => t + e[1], 0);
  let acc = 0;
  for (const e of list) { acc += e[1] / total; if (u <= acc) return e; }
  return list[list.length - 1];
}

function buildWorld(hole, look) {
  const b = holeBounds(hole, MARGIN);
  const x0 = b.minX, y0 = b.minY, nx = b.maxX - b.minX, ny = b.maxY - b.minY;
  const surf = new Uint8Array(nx * ny);
  const hgt = new Float32Array(nx * ny);
  const stripe = new Uint8Array(nx * ny);
  for (let j = 0; j < ny; j++) {
    for (let i = 0; i < nx; i++) {
      const p = { x: x0 + i + 0.5, y: y0 + j + 0.5 };
      const s = SURF_INDEX[surfaceAt(hole, p, true)];
      const k = j * nx + i;
      surf[k] = s;
      hgt[k] = heightAt(hole, p);
      if (s === 2 || s === 4 || s === 3 || s === 5) {
        const pr = project(hole.line, p);
        stripe[k] = s === 2 ? Math.floor(pr.s / 9) & 1 : Math.floor((pr.s + 50) / 3) & 1;
      }
    }
  }

  const world = { hole, look, x0, y0, nx, ny, surf, hgt, stripe, trees: [], bushes: [] };

  // Trees on a jittered lattice through the woods; the odd lone tree and bush
  // in the rough, kept clear of the short grass.
  const seed = hole.seed;
  const sparse = look.sparse ? 0.4 : 0.85;
  const shortGrassNear = (x, y, r) => {
    for (let a = 0; a < 8; a++) {
      const s = surfIdxAt(world, x + Math.cos(a * 0.785) * r, y + Math.sin(a * 0.785) * r);
      if (s === 2 || s === 4 || s === 3 || s === 5 || s === 6 || s === 7) return true;
    }
    return false;
  };
  for (let gy = Math.floor(y0 / TREE_STEP); gy * TREE_STEP < y0 + ny; gy++) {
    for (let gx = Math.floor(x0 / TREE_STEP); gx * TREE_STEP < x0 + nx; gx++) {
      const x = gx * TREE_STEP + (hash2(gx, gy, seed) - 0.5) * TREE_STEP * 0.9;
      const y = gy * TREE_STEP + (hash2(gx, gy, seed + 1) - 0.5) * TREE_STEP * 0.9;
      const s = surfIdxAt(world, x, y);
      const u = hash2(gx, gy, seed + 2);
      let kind = null;
      if (s === 0 || s === 9) { if (u < sparse) kind = 'tree'; }
      else if (s === 1 && u < 0.012 && !shortGrassNear(x, y, 9)) kind = 'tree';
      else if ((s === 1 || s === 8 || s === 11) && u > 0.975 && look.bushes.length && !shortGrassNear(x, y, 4)) kind = 'bush';
      if (!kind) continue;
      const [name, , size] = pickWeighted(kind === 'tree' ? look.trees : look.bushes, hash2(gx, gy, seed + 3));
      const scale = 0.8 + 0.45 * hash2(gx, gy, seed + 4);
      const t = { x, y, h: groundAt(world, x, y), name, height: size * scale, flip: hash2(gx, gy, seed + 5) < 0.5 };
      t.solid = t.height > 4; // bushes only catch the ball if it rolls into them
      (kind === 'tree' ? world.trees : world.bushes).push(t);
    }
  }

  // A coarse lookup of trees by 8-yard cell, for the ball hitting them.
  world.treeCells = new Map();
  for (const t of world.trees) {
    const key = `${Math.floor(t.x / 8)},${Math.floor(t.y / 8)}`;
    if (!world.treeCells.has(key)) world.treeCells.set(key, []);
    world.treeCells.get(key).push(t);
  }
  return world;
}

function cellIndex(w, x, y) {
  const i = Math.floor(x - w.x0), j = Math.floor(y - w.y0);
  if (i < 0 || j < 0 || i >= w.nx || j >= w.ny) return -1;
  return j * w.nx + i;
}

function surfIdxAt(w, x, y) {
  const k = cellIndex(w, x, y);
  return k < 0 ? S_OOB : w.surf[k];
}

// The surface a ball plays from at (x, y), e.g. 'fairway', 'water' or 'oob'.
function lieAt(w, x, y) {
  const n = SURF_NAMES[surfIdxAt(w, x, y)];
  return PLAYS_AS[n] ?? n;
}

// Ground height at (x, y), smoothly between cells; clamped to the edge outside the grid.
function groundAt(w, x, y) {
  let fx = x - w.x0 - 0.5, fy = y - w.y0 - 0.5;
  fx = Math.max(0, Math.min(w.nx - 1.001, fx));
  fy = Math.max(0, Math.min(w.ny - 1.001, fy));
  const i = Math.floor(fx), j = Math.floor(fy), u = fx - i, v = fy - j;
  const k = j * w.nx + i, h = w.hgt;
  const i1 = i + 1 < w.nx ? 1 : 0, j1 = j + 1 < w.ny ? w.nx : 0;
  return h[k] * (1 - u) * (1 - v) + h[k + i1] * u * (1 - v) + h[k + j1] * (1 - u) * v + h[k + i1 + j1] * u * v;
}

// Which way the ground rises at (x, y), yards up per yard.
function groundSlope(w, x, y, d = 0.5) {
  return {
    x: (groundAt(w, x + d, y) - groundAt(w, x - d, y)) / (2 * d),
    y: (groundAt(w, x, y + d) - groundAt(w, x, y - d)) / (2 * d),
  };
}

function treesNear(w, x, y) {
  const out = [];
  const cx = Math.floor(x / 8), cy = Math.floor(y / 8);
  for (let j = cy - 1; j <= cy + 1; j++) for (let i = cx - 1; i <= cx + 1; i++) {
    const l = w.treeCells.get(`${i},${j}`);
    if (l) out.push(...l);
  }
  return out;
}

// ---- render.js ----
// The view from behind the golfer, drawn a pixel at a time into an ImageData.
// The ground is drawn like an old voxel-landscape engine: each screen column
// marches out from the camera, and wherever the ground at that distance shows
// above what's already drawn, it fills the column up to it. Trees, the flag and
// the ball are then drawn as scaled sprites, tested against a depth buffer so
// hills and trees hide what's behind them.


const T_NEAR = 0.6;
const T_FAR = 720;
const BAYER = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5].map((v) => v / 16);
const QUANT = 9; // colour steps, for a slightly posterised retro look

const pack = (r, g, b) => (255 << 24) | (Math.max(0, Math.min(255, b | 0)) << 16) | (Math.max(0, Math.min(255, g | 0)) << 8) | Math.max(0, Math.min(255, r | 0));

function makeView(W, H) {
  const img = new ImageData(W, H);
  return {
    W, H, img, px: new Uint32Array(img.data.buffer), depth: new Float32Array(W * H),
    staticPx: new Uint32Array(W * H), staticDepth: new Float32Array(W * H),
  };
}

// Camera vectors: yaw 0 looks up +y (down the hole from the tee), +x is right.
function camAxes(cam) {
  const s = Math.sin(cam.yaw), c = Math.cos(cam.yaw);
  return { fx: s, fy: c, rx: c, ry: -s };
}

// Screen position of a world point, or null if behind the camera.
function project3(cam, W, x, y, z) {
  const a = camAxes(cam);
  const dx = x - cam.x, dy = y - cam.y;
  const t = dx * a.fx + dy * a.fy;
  if (t < 0.3) return null;
  const s = dx * a.rx + dy * a.ry;
  return { x: W / 2 + (s * cam.f) / t, y: cam.horizon + ((cam.eye - z) * cam.f) / t, t };
}

function drawSky(view, cam, bd) {
  const { W, H, px, depth } = view;
  const period = bd.w * 2;
  const u0 = (cam.yaw / (Math.PI * 2)) * period * 2;
  const bottom = Math.round(cam.horizon + 5);
  const top = bottom - bd.h;
  const [sr, sg, sb] = bd.sky;
  for (let y = 0; y < H; y++) {
    const row = y * W;
    if (y < top) {
      const k = 1 - y / Math.max(1, top);
      const c = pack(sr - 40 * (1 - k) * 0.6, sg - 34 * (1 - k) * 0.6, sb - 10 * (1 - k) * 0.6);
      for (let x = 0; x < W; x++) { px[row + x] = c; depth[row + x] = 1e9; }
    } else {
      const v = Math.min(bd.h - 1, y - top);
      for (let x = 0; x < W; x++) {
        let u = Math.floor(u0 + x - W / 2) % period;
        if (u < 0) u += period;
        if (u >= bd.w) u = period - 1 - u;
        px[row + x] = bd.data[v * bd.w + u] | 0xff000000;
        depth[row + x] = 1e9;
      }
    }
  }
}

// Draw the ground and the static sprites (trees, bushes) for one camera.
// opts: { grid: true to draw the putting grid on the green, clear: {x, y, r} to
// leave out trees round the ball so they don't block the view }.
function renderScene(view, world, cam, art, opts = {}) {
  const { W, H, px, depth } = view;
  const look = world.look;
  drawSky(view, cam, art.backdrop);
  const { fx, fy, rx, ry } = camAxes(cam);
  const { x0, y0, nx, ny, surf, hgt, stripe } = world;
  const base = SURF_NAMES.map((n) => look.ground[n] ?? look.ground.rough);
  const [hr, hg, hb] = look.haze;
  const f = cam.f, eye = cam.eye, hor = cam.horizon;
  const grid = !!opts.grid;

  for (let x = 0; x < W; x++) {
    const k0 = (x - W / 2 + 0.5) / f;
    const dx = fx + rx * k0, dy = fy + ry * k0;
    let ybuf = H;
    let t = T_NEAR;
    while (t < T_FAR && ybuf > 0) {
      const wx = cam.x + dx * t, wy = cam.y + dy * t;
      let i = Math.floor(wx - x0), j = Math.floor(wy - y0);
      let s, h, k;
      const inside = i >= 0 && j >= 0 && i < nx && j < ny;
      if (!inside) {
        s = S_OOB;
        i = Math.max(0, Math.min(nx - 1, i)); j = Math.max(0, Math.min(ny - 1, j));
        k = j * nx + i;
        h = hgt[k];
      } else {
        k = j * nx + i;
        s = surf[k];
        if (t < 60) {
          // Smooth heights close up, so slopes don't look like steps.
          const fxp = wx - x0 - 0.5, fyp = wy - y0 - 0.5;
          const bi = Math.max(0, Math.min(nx - 2, Math.floor(fxp))), bj = Math.max(0, Math.min(ny - 2, Math.floor(fyp)));
          const u = Math.max(0, Math.min(1, fxp - bi)), v = Math.max(0, Math.min(1, fyp - bj));
          const kk = bj * nx + bi;
          h = hgt[kk] * (1 - u) * (1 - v) + hgt[kk + 1] * u * (1 - v) + hgt[kk + nx] * (1 - u) * v + hgt[kk + nx + 1] * u * v;
        } else h = hgt[k];
      }
      const sy = hor + ((eye - h) * f) / t;
      if (sy < ybuf) {
        // Light from the upper left, from the slope of the ground.
        const kl = i > 0 ? k - 1 : k, kr = i < nx - 1 ? k + 1 : k, kd = j > 0 ? k - nx : k, ku = j < ny - 1 ? k + nx : k;
        let light = 1 + 0.42 * ((hgt[kl] - hgt[kr]) + 0.6 * (hgt[ku] - hgt[kd]));
        const n = hash2(i, j, 7);
        const c = base[s];
        if (s === 2) light *= stripe[k] ? 1.07 : 0.95;
        else if (s === 4 || s === 3) light *= stripe[k] ? 1.04 : 0.97;
        else if (s === 7 || s === 10) light = 1 + (n > 0.97 ? 0.25 : 0) + 0.05 * Math.sin(wy * 0.6 + wx * 0.2);
        if (s !== 7 && s !== 10) light *= s === 6 || s === 11 ? 0.97 + 0.06 * n : s === 1 || s === 0 || s === 9 || s === 12 ? 0.9 + 0.2 * n : 0.97 + 0.06 * n;
        if (grid && s === 4 && t > 1 && t < 30) {
          // A faint one-yard grid on the green so its slopes show.
          const lw = 0.02 + t * 0.004;
          const gx = wx - Math.floor(wx), gy = wy - Math.floor(wy);
          if (gx < lw || gy < lw) light *= 0.9;
        }
        if (light < 0.55) light = 0.55; else if (light > 1.4) light = 1.4;
        let fog = (t - 90) / (T_FAR - 90);
        fog = fog < 0 ? 0 : fog * 0.85;
        const r = c[0] * light * (1 - fog) + hr * fog, g = c[1] * light * (1 - fog) + hg * fog, b = c[2] * light * (1 - fog) + hb * fog;
        let ytop = Math.ceil(sy);
        if (ytop < 0) ytop = 0;
        for (let y = ytop; y < ybuf; y++) {
          const d = BAYER[(x & 3) + ((y & 3) << 2)] * QUANT;
          const p = y * W + x;
          px[p] = (255 << 24) | (Math.min(255, Math.floor((b + d) / QUANT) * QUANT) << 16) | (Math.min(255, Math.floor((g + d) / QUANT) * QUANT) << 8) | Math.min(255, Math.floor((r + d) / QUANT) * QUANT);
          depth[p] = t;
        }
        ybuf = ytop;
      }
      t += t < 12 ? 0.07 : t * 0.0085;
    }
  }

  // Trees and bushes.
  const clear = opts.clear;
  const drawList = (list) => {
    for (const tr of list) {
      if (clear) {
        const ddx = tr.x - clear.x, ddy = tr.y - clear.y;
        if (ddx * ddx + ddy * ddy < clear.r * clear.r) continue;
      }
      drawSprite(view, cam, art.sprites[tr.name], tr.x, tr.y, tr.h, tr.height, tr.flip, look.haze);
    }
  };
  drawList(world.trees);
  drawList(world.bushes);
  view.staticPx.set(px);
  view.staticDepth.set(depth);
}

// Start a frame from the cached static scene.
function restoreScene(view) {
  view.px.set(view.staticPx);
  view.depth.set(view.staticDepth);
}

// A sprite standing on the ground at (x, y) whose foot is at height gh, `height` yards tall.
function drawSprite(view, cam, spr, x, y, gh, height, flip, haze, bias = 0) {
  if (!spr) return;
  const { W, H, px, depth } = view;
  const { fx, fy, rx, ry } = camAxes(cam);
  const dx = x - cam.x, dy = y - cam.y;
  const t = dx * fx + dy * fy;
  if (t < 0.8 || t > T_FAR) return;
  const s = dx * rx + dy * ry;
  const scale = (height * cam.f) / t / spr.h;
  const sx = W / 2 + (s * cam.f) / t;
  const left = sx - spr.ax * scale, top = cam.horizon + ((cam.eye - gh) * cam.f) / t - spr.ay * scale;
  const right = left + spr.w * scale, bottom = top + spr.h * scale;
  if (right < 0 || left >= W || bottom < 0 || top >= H) return;
  let fog = (t - 90) / (T_FAR - 90);
  fog = fog < 0 ? 0 : fog * 0.85;
  const [hr, hg, hb] = haze;
  const x0 = Math.max(0, Math.ceil(left)), x1 = Math.min(W, Math.ceil(right));
  const y0 = Math.max(0, Math.ceil(top)), y1 = Math.min(H, Math.ceil(bottom));
  const data = spr.data, w = spr.w;
  const td = t - bias;
  for (let yy = y0; yy < y1; yy++) {
    const sv = Math.min(spr.h - 1, Math.floor((yy - top) / scale));
    const row = sv * w;
    for (let xx = x0; xx < x1; xx++) {
      let su = Math.min(w - 1, Math.floor((xx - left) / scale));
      if (flip) su = w - 1 - su;
      const c = data[row + su];
      if ((c >>> 24) < 128) continue;
      const p = yy * W + xx;
      if (depth[p] <= td) continue;
      if (fog > 0) {
        const r = c & 255, g = (c >> 8) & 255, b = (c >> 16) & 255;
        px[p] = pack(r * (1 - fog) + hr * fog, g * (1 - fog) + hg * fog, b * (1 - fog) + hb * fog);
      } else px[p] = c | 0xff000000;
      depth[p] = td;
    }
  }
}

// Fill a screen ellipse, with a depth test at depth t.
function fillEllipse(view, cx, cy, rxp, ryp, color, t, alpha = 1) {
  const { W, H, px, depth } = view;
  const x0 = Math.max(0, Math.floor(cx - rxp)), x1 = Math.min(W - 1, Math.ceil(cx + rxp));
  const y0 = Math.max(0, Math.floor(cy - ryp)), y1 = Math.min(H - 1, Math.ceil(cy + ryp));
  const r = color & 255, g = (color >> 8) & 255, b = (color >> 16) & 255;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const u = (x + 0.5 - cx) / rxp, v = (y + 0.5 - cy) / ryp;
    if (u * u + v * v > 1) continue;
    const p = y * W + x;
    if (depth[p] < t) continue;
    if (alpha >= 1) px[p] = color;
    else {
      const c = px[p];
      px[p] = pack((c & 255) * (1 - alpha) + r * alpha, ((c >> 8) & 255) * (1 - alpha) + g * alpha, ((c >> 16) & 255) * (1 - alpha) + b * alpha);
    }
  }
}

// The ball (and its shadow on the ground below it).
function drawBall(view, cam, x, y, z, gz, { shadow = true, color = 0xfff8f8f8 } = {}) {
  const sh = project3(cam, view.W, x, y, gz);
  if (shadow && sh && z - gz > 0.05) {
    const rr = Math.max(1, (0.06 * cam.f) / sh.t);
    fillEllipse(view, sh.x, sh.y, rr, rr * 0.45, 0xff000000, sh.t + 0.3, 0.35);
  }
  const p = project3(cam, view.W, x, y, z + 0.024);
  if (!p) return null;
  const r = Math.max(0.9, (0.024 * cam.f) / p.t);
  if (r > 1.6) fillEllipse(view, p.x, p.y, r + 0.7, r + 0.7, 0xff303030, p.t - 0.05);
  fillEllipse(view, p.x, p.y, r, r, color, p.t - 0.06);
  return p;
}

// ---- physics.js ----
// The ball: clubs, flight through the air (drag, backspin lift, side spin from
// the snap, wind), bouncing, rolling down slopes, trees, water and the hole.
// Units are yards and seconds; z is height above the sea, as the terrain is.


const G = 10.73;          // gravity, yards / s^2
const MPH = 0.4889;       // yards / s per mph
const DRAG = 0.0040;             // per yard
const LIFT = 0.0034;             // per yard, at full backspin
const DT = 1 / 120;
const CUP_R = 0.06;       // yards (a 4.25 inch hole is 0.059)

const CLUBS = [
  { key: '1W', name: 'DRIVER', carry: 245, launch: 11, spin: 0.8, check: 0 },
  { key: '3W', name: '3 WOOD', carry: 225, launch: 12, spin: 0.85, check: 0.02 },
  { key: '5W', name: '5 WOOD', carry: 208, launch: 14, spin: 0.9, check: 0.05 },
  { key: '3I', name: '3 IRON', carry: 192, launch: 13, spin: 0.92, check: 0.08 },
  { key: '4I', name: '4 IRON', carry: 182, launch: 14, spin: 0.95, check: 0.1 },
  { key: '5I', name: '5 IRON', carry: 172, launch: 15.5, spin: 1, check: 0.14 },
  { key: '6I', name: '6 IRON', carry: 161, launch: 17, spin: 1.03, check: 0.18 },
  { key: '7I', name: '7 IRON', carry: 150, launch: 19, spin: 1.06, check: 0.22 },
  { key: '8I', name: '8 IRON', carry: 138, launch: 21, spin: 1.1, check: 0.27 },
  { key: '9I', name: '9 IRON', carry: 125, launch: 24, spin: 1.14, check: 0.32 },
  { key: 'PW', name: 'P WEDGE', carry: 110, launch: 27, spin: 1.18, check: 0.38 },
  { key: 'SW', name: 'S WEDGE', carry: 88, launch: 33, spin: 1.22, check: 0.45 },
  { key: 'LW', name: 'L WEDGE', carry: 62, launch: 40, spin: 1.25, check: 0.5 },
  { key: 'PT', name: 'PUTTER', carry: 0, launch: 0, spin: 0, check: 0, putter: true },
];
const PUTTER = CLUBS.length - 1;

// How each surface treats a ball: bounce (rest), speed kept along the ground on a
// bounce (keep), rolling friction (mu), and what a full shot from it gets (lie).
const GROUND = {
  tee: { rest: 0.3, keep: 0.62, mu: 0.13, lie: [1, 1] },
  fairway: { rest: 0.3, keep: 0.6, mu: 0.15, lie: [1, 1] },
  fringe: { rest: 0.28, keep: 0.55, mu: 0.12, lie: [0.95, 0.98] },
  green: { rest: 0.22, keep: 0.5, mu: 0.068, lie: [1, 1] },
  rough: { rest: 0.12, keep: 0.32, mu: 0.4, lie: [0.76, 0.9] },
  trees: { rest: 0.12, keep: 0.25, mu: 0.5, lie: [0.5, 0.68] },
  waste: { rest: 0.25, keep: 0.5, mu: 0.25, lie: [0.82, 0.92] },
  bunker: { rest: 0.02, keep: 0.08, mu: 2.2, lie: [0.66, 0.78] },
  water: { rest: 0, keep: 0, mu: 9, lie: [0, 0] },
  oob: { rest: 0.3, keep: 0.6, mu: 0.13, lie: [1, 1] },
};
const LIE_NAMES = {
  tee: 'TEE', fairway: 'FAIRWAY', fringe: 'FRINGE', green: 'GREEN', rough: 'ROUGH', trees: 'TREES',
  waste: 'WASTE GROUND', bunker: 'BUNKER', water: 'WATER', oob: 'OUT OF BOUNDS',
};

// Per tree sprite: where its canopy starts (fraction of height) and its radius (fraction of height).
const TREE_SHAPE = {
  'tree-palm': [0.72, 0.28], 'tree-cactus': [0.05, 0.12], 'tree-poplar': [0.15, 0.12], 'tree-fir': [0.1, 0.2],
  'tree-snowpine': [0.12, 0.22], 'tree-pine': [0.55, 0.2], 'bush-gorse': [0, 0.5], 'bush-green': [0, 0.5],
};

// One step of flight. `s` is the ball state; spin decays as it flies.
function flyStep(s, wind, dt) {
  const ax0 = s.vx - wind.x, ay0 = s.vy - wind.y, az0 = s.vz;
  const sp = Math.hypot(ax0, ay0, az0);
  // Spin axis: horizontal and square to the line of flight, tilted by side spin.
  const hl = Math.hypot(s.vx, s.vy) || 1;
  const rxh = s.vy / hl, ryh = -s.vx / hl; // right of the line of flight
  const ct = Math.cos(s.tilt), st = Math.sin(s.tilt);
  const axx = rxh * ct, axy = ryh * ct, axz = st;
  // Lift = axis x air velocity.
  const lx = axy * az0 - axz * ay0, ly = axz * ax0 - axx * az0, lz = axx * ay0 - axy * ax0;
  const kL = LIFT * s.spin * sp;
  s.vx += (-DRAG * sp * ax0 + kL * lx) * dt;
  s.vy += (-DRAG * sp * ay0 + kL * ly) * dt;
  s.vz += (-G - DRAG * sp * az0 + kL * lz) * dt;
  s.x += s.vx * dt; s.y += s.vy * dt; s.z += s.vz * dt;
  s.spin *= Math.exp(-dt / 6);
}

// Carry on flat, calm ground for a ball speed, used to set the speed for a club and power.
function flatCarry(club, speed) {
  const a = (club.launch * Math.PI) / 180;
  const s = { x: 0, y: 0, z: 0, vx: 0, vy: speed * Math.cos(a), vz: speed * Math.sin(a), spin: club.spin, tilt: 0 };
  const calm = { x: 0, y: 0 };
  for (let i = 0; i < 4000; i++) {
    flyStep(s, calm, DT);
    if (s.z <= 0 && s.vz < 0) return s.y;
  }
  return s.y;
}

const speedCache = new Map();
// Ball speed that carries `carry` yards with this club.
function speedFor(club, carry) {
  const key = `${club.key}:${Math.round(carry)}`;
  if (speedCache.has(key)) return speedCache.get(key);
  let lo = 5, hi = 140;
  for (let i = 0; i < 30; i++) {
    const mid = (lo + hi) / 2;
    if (flatCarry(club, mid) < carry) lo = mid; else hi = mid;
  }
  speedCache.set(key, (lo + hi) / 2);
  return (lo + hi) / 2;
}

// Where in a lie's range a ball sits, the same for the same spot.
function lieFactor(lie, x, y) {
  const [a, b] = GROUND[lie]?.lie ?? [1, 1];
  const u = Math.abs(Math.sin(x * 12.9898 + y * 78.233) * 43758.5453) % 1;
  return a + (b - a) * u;
}

function hitTree(world, s) {
  for (const t of treesNear(world, s.x, s.y)) {
    if (!t.solid && s.z > t.h + t.height) continue;
    const [c0, rf] = TREE_SHAPE[t.name] ?? [0.3, 0.3];
    const dz = s.z - t.h;
    if (dz < 0 || dz > t.height * 0.97) continue;
    const d = Math.hypot(s.x - t.x, s.y - t.y);
    const canopy = dz > t.height * c0 && d < t.height * rf * (0.7 + 0.3 * Math.sin(Math.PI * (dz / t.height)));
    const trunk = d < 0.35;
    if (canopy || trunk) return t;
  }
  return null;
}

// Play a full shot. Returns { path: [{x,y,z}] sampled every 1/60 s, end, result,
// carry, hitTree, landed }. result: 'rest' | 'water' | 'oob' | 'holed'.
function playShot(world, from, { club, power, yaw, snap, wind, rng, lie }) {
  const hole = world.hole;
  const lf = lieFactor(lie, from.x, from.y);
  let carry = club.carry * power * lf;
  if (club.key === '1W' && lie !== 'tee') carry *= lie === 'fairway' ? 0.92 : 0.75;
  if ((lie === 'bunker') && (club.key === 'SW' || club.key === 'LW')) carry = club.carry * power * Math.min(1, lf + 0.2);
  const speed = speedFor(club, Math.max(3, carry));
  const dir = yaw + snap.push;
  const a = (club.launch * Math.PI) / 180 * (lie === 'trees' ? 0.7 : 1);
  const s = {
    x: from.x, y: from.y, z: groundAt(world, from.x, from.y) + 0.02,
    vx: speed * Math.cos(a) * Math.sin(dir), vy: speed * Math.cos(a) * Math.cos(dir), vz: speed * Math.sin(a),
    spin: club.spin * (lie === 'rough' || lie === 'trees' ? 0.6 : 1), tilt: snap.tilt,
  };
  const path = [{ x: s.x, y: s.y, z: s.z }];
  let treeHit = null, steps = 0;
  // In the air.
  for (; steps < 120 * 20; steps++) {
    flyStep(s, wind, DT);
    if (steps % 2 === 1) path.push({ x: s.x, y: s.y, z: s.z });
    const g = groundAt(world, s.x, s.y);
    if (!treeHit && path.length > 6) {
      const t = hitTree(world, s);
      if (t) {
        treeHit = t;
        const sp = Math.hypot(s.vx, s.vy) * (0.08 + 0.15 * rng());
        const ang = Math.atan2(s.vx, s.vy) + Math.PI + (rng() - 0.5) * 2.2;
        s.vx = Math.sin(ang) * sp; s.vy = Math.cos(ang) * sp; s.vz = Math.min(0, s.vz) * 0.2; s.spin = 0;
      }
    }
    if (s.z <= g && s.vz < 0) { s.z = g; break; }
  }
  const landed = { x: s.x, y: s.y };
  const out = bounceAndRoll(world, s, path, club, rng);
  out.carry = Math.hypot(landed.x - from.x, landed.y - from.y);
  out.landed = landed;
  out.hitTree = !!treeHit;
  return out;
}

// After the ball comes down: bounces, then rolls. Mutates s, extends path.
function bounceAndRoll(world, s, path, club, rng) {
  const hole = world.hole;
  let bounces = 0;
  for (;;) {
    const lie = lieAt(world, s.x, s.y);
    if (lie === 'water') return { path, end: { x: s.x, y: s.y }, result: 'water', lie };
    if (lie === 'oob') return { path, end: { x: s.x, y: s.y }, result: 'oob', lie };
    const gr = GROUND[lie];
    const vh = Math.hypot(s.vx, s.vy);
    // Holed on the fly or first bounce: rare, but lovely.
    if (Math.hypot(s.x - hole.pin.x, s.y - hole.pin.y) < CUP_R && Math.abs(s.vz) < 12 && vh < 6) {
      path.push({ x: hole.pin.x, y: hole.pin.y, z: groundAt(world, hole.pin.x, hole.pin.y) - 0.05 });
      return { path, end: { x: hole.pin.x, y: hole.pin.y }, result: 'holed', lie: 'green' };
    }
    let keep = gr.keep * Math.max(0.05, 1 - club.check * (bounces === 0 ? 1 : 0.5) * (lie === 'green' || lie === 'fringe' ? 1.9 : 1.5));
    s.vx *= keep; s.vy *= keep;
    s.vz = -s.vz * gr.rest;
    bounces++;
    if (s.vz < 1.6) break;
    // Hop.
    const wind0 = { x: 0, y: 0 };
    s.spin = 0; s.tilt = 0;
    for (let i = 0; i < 2000; i++) {
      flyStep(s, wind0, DT);
      if (i % 2 === 1) path.push({ x: s.x, y: s.y, z: s.z });
      const g = groundAt(world, s.x, s.y);
      if (s.z <= g && s.vz < 0) { s.z = g; break; }
    }
  }
  return roll(world, s, path, rng);
}

// Roll along the ground until the ball stops, drops, or finds water or out of bounds.
function roll(world, s, path, rng) {
  const hole = world.hole;
  const dt = 1 / 120;
  let vx = s.vx, vy = s.vy, x = s.x, y = s.y;
  let lipped = false;
  for (let i = 0; i < 120 * 40; i++) {
    const lie = lieAt(world, x, y);
    if (lie === 'water') return { path, end: { x, y }, result: 'water', lie };
    if (lie === 'oob') return { path, end: { x, y }, result: 'oob', lie };
    const mu = GROUND[lie].mu;
    const sl = groundSlope(world, x, y);
    const sp = Math.hypot(vx, vy);
    const gx = -G * sl.x * 0.85, gy = -G * sl.y * 0.85; // a rolling ball feels about 5/7 of the slope; a touch more reads better
    // The hole.
    const dh = Math.hypot(x - hole.pin.x, y - hole.pin.y);
    if (dh < CUP_R) {
      if (sp < 1.45) {
        path.push({ x: hole.pin.x, y: hole.pin.y, z: groundAt(world, hole.pin.x, hole.pin.y) - 0.05 });
        return { path, end: { x: hole.pin.x, y: hole.pin.y }, result: 'holed', lie: 'green' };
      }
      if (!lipped && sp < 2.6) {
        lipped = true;
        const ang = Math.atan2(vx, vy) + (rng() < 0.5 ? 1 : -1) * (0.5 + rng() * 0.6);
        vx = Math.sin(ang) * sp * 0.55; vy = Math.cos(ang) * sp * 0.55;
      }
    }
    if (sp < 0.03) {
      const pull = Math.hypot(gx, gy);
      if (pull < mu * G * 1.35) break;
      vx += gx * dt; vy += gy * dt;
    } else {
      const fr = mu * G;
      const ox = vx, oy = vy;
      vx += (gx - (fr * vx) / sp) * dt;
      vy += (gy - (fr * vy) / sp) * dt;
      // Friction mustn't send the ball backwards.
      if (vx * ox + vy * oy < 0 && sp < fr * dt * 2) { vx = 0; vy = 0; }
    }
    x += vx * dt; y += vy * dt;
    if (i % 2 === 1) path.push({ x, y, z: groundAt(world, x, y) });
  }
  return { path, end: { x, y }, result: 'rest', lie: lieAt(world, x, y) };
}

// A putt (or a putter from off the green): straight off the face, rolling from the start.
function playPutt(world, from, { yaw, distance, snap, rng }) {
  const lie = lieAt(world, from.x, from.y);
  const mu = GROUND[lie === 'green' ? 'green' : lie]?.mu ?? 0.13;
  // Speed that would roll `distance` yards on the flat, on the green's friction.
  const v0 = Math.sqrt(2 * GROUND.green.mu * G * Math.max(0.1, distance)) * (lie === 'green' ? 1 : Math.sqrt(mu / GROUND.green.mu) * 0.92);
  const dir = yaw + snap.push;
  const s = { x: from.x, y: from.y, vx: Math.sin(dir) * v0, vy: Math.cos(dir) * v0 };
  const path = [{ x: from.x, y: from.y, z: groundAt(world, from.x, from.y) }];
  const out = roll(world, s, path, rng);
  out.carry = 0;
  out.landed = from;
  return out;
}

// Where to drop after water: back along the path to dry land, a couple of yards short.
function dropFromWater(world, path, from) {
  let k = path.length - 1;
  while (k > 0 && lieAt(world, path[k].x, path[k].y) === 'water') k--;
  // Step back a little further so the drop isn't on the edge.
  const p = path[k];
  const dx = from.x - p.x, dy = from.y - p.y, d = Math.hypot(dx, dy) || 1;
  for (let back = 2; back < 40; back += 1) {
    const q = { x: p.x + (dx / d) * back, y: p.y + (dy / d) * back };
    const l = lieAt(world, q.x, q.y);
    if (l !== 'water' && l !== 'oob' && l !== 'bunker') return q;
  }
  return { ...from };
}

// ---- sprites.js ----
// Decodes the packed Pixellab art into pixel arrays the renderer can scale, and
// into canvases for the golfer, recoloured for each player's shirt.


function loadImage(src) {
  return new Promise((resolve, reject) => {
    const im = new Image();
    im.onload = () => resolve(im);
    im.onerror = reject;
    im.src = src;
  });
}

function toCanvas(im) {
  const c = document.createElement('canvas');
  c.width = im.width; c.height = im.height;
  c.getContext('2d').drawImage(im, 0, 0);
  return c;
}

function pixelsOf(canvas) {
  const d = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
  return new Uint32Array(d.data.buffer);
}

// Shirt colours for up to four players (the art's shirt is white).
const SHIRTS = [
  { name: 'WHITE', rgb: [236, 236, 230] },
  { name: 'RED', rgb: [214, 64, 58] },
  { name: 'BLUE', rgb: [62, 112, 214] },
  { name: 'YELLOW', rgb: [238, 196, 52] },
  { name: 'GREEN', rgb: [60, 170, 90] },
  { name: 'PINK', rgb: [232, 120, 176] },
];

// Swap the white shirt and cap for a colour, keeping the shading.
function recolour(src, rgb) {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const ctx = c.getContext('2d');
  ctx.drawImage(src, 0, 0);
  const d = ctx.getImageData(0, 0, c.width, c.height);
  const p = d.data;
  const waist = c.height * 0.52;
  for (let i = 0; i < p.length; i += 4) {
    const y = Math.floor(i / 4 / c.width);
    if (y > waist || p[i + 3] === 0) continue;
    const r = p[i], g = p[i + 1], b = p[i + 2];
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b);
    if (mx > 150 && mx - mn < 34) {
      const k = (mx / 240) ** 1.3;
      p[i] = Math.min(255, rgb[0] * k); p[i + 1] = Math.min(255, rgb[1] * k); p[i + 2] = Math.min(255, rgb[2] * k);
    }
  }
  ctx.putImageData(d, 0, 0);
  return c;
}

async function loadArt() {
  const golfer = {};
  for (const [k, src] of Object.entries(GOLFER_FRAMES)) golfer[k] = toCanvas(await loadImage(src));
  const sprites = {};
  for (const [k, s] of Object.entries(SPRITES)) {
    const c = toCanvas(await loadImage(s.src));
    sprites[k] = { w: c.width, h: c.height, ax: s.ax, ay: s.ay, data: pixelsOf(c), canvas: c };
  }
  const backdrops = {};
  for (const [k, src] of Object.entries(BACKDROPS)) {
    const c = toCanvas(await loadImage(src));
    const data = pixelsOf(c);
    // The colour at the top of the sky, to carry on upwards.
    const top = data[2 * c.width + 3];
    backdrops[k] = { w: c.width, h: c.height, data, sky: [top & 255, (top >> 8) & 255, (top >> 16) & 255] };
  }
  const swing = Object.keys(golfer).filter((k) => k.startsWith('swing')).sort();
  const putt = Object.keys(golfer).filter((k) => k.startsWith('putt')).sort();
  const shirts = new Map();
  return {
    golfer, sprites, backdrops, swing, putt, ball: GOLFER_BALL,
    // Golfer frames in a shirt colour, made on first use.
    golferFor(shirt) {
      if (!shirts.has(shirt)) {
        const set = {};
        for (const [k, c] of Object.entries(golfer)) set[k] = shirt === 0 ? c : recolour(c, SHIRTS[shirt].rgb);
        shirts.set(shirt, set);
      }
      return shirts.get(shirt);
    },
  };
}

// ---- audio.js ----
// Little synthesised sounds: the swing, the strike, the cup, a splash, a tree, applause.

let actx = null;
let muted = false;

function ac() {
  if (!actx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    actx = new C();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}

const toggleMute = () => (muted = !muted);
const isMuted = () => muted;

function noiseBurst(a, dur, { freq = 1200, q = 0.8, gain = 0.3, type = 'bandpass', attack = 0.005, sweep = null } = {}) {
  const n = Math.floor(a.sampleRate * dur);
  const buf = a.createBuffer(1, n, a.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = a.createBufferSource();
  src.buffer = buf;
  const f = a.createBiquadFilter();
  f.type = type; f.frequency.value = freq; f.Q.value = q;
  if (sweep) f.frequency.exponentialRampToValueAtTime(sweep, a.currentTime + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, a.currentTime);
  g.gain.exponentialRampToValueAtTime(gain, a.currentTime + attack);
  g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
  src.connect(f).connect(g).connect(a.destination);
  src.start();
}

function tone(a, freq, dur, { type = 'square', gain = 0.08, delay = 0, slide = null } = {}) {
  const o = a.createOscillator();
  o.type = type;
  const t0 = a.currentTime + delay;
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  const g = a.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0);
  o.stop(t0 + dur + 0.02);
}

function sfx(name) {
  if (muted) return;
  const a = ac();
  if (!a) return;
  switch (name) {
    case 'whoosh': noiseBurst(a, 0.28, { freq: 600, sweep: 2600, q: 1.2, gain: 0.25, attack: 0.15 }); break;
    case 'hit': noiseBurst(a, 0.08, { freq: 2400, q: 2, gain: 0.6 }); tone(a, 1500, 0.05, { type: 'triangle', gain: 0.2 }); break;
    case 'putt': tone(a, 900, 0.05, { type: 'triangle', gain: 0.15 }); break;
    case 'cup': tone(a, 700, 0.06, { type: 'triangle', gain: 0.2 }); tone(a, 520, 0.08, { type: 'triangle', gain: 0.2, delay: 0.07 }); tone(a, 440, 0.1, { type: 'triangle', gain: 0.18, delay: 0.16 }); break;
    case 'splash': noiseBurst(a, 0.6, { freq: 800, sweep: 200, q: 0.6, gain: 0.4, type: 'lowpass', attack: 0.01 }); break;
    case 'tree': noiseBurst(a, 0.25, { freq: 3000, q: 0.5, gain: 0.25 }); tone(a, 180, 0.08, { type: 'square', gain: 0.06 }); break;
    case 'thud': noiseBurst(a, 0.08, { freq: 300, q: 1, gain: 0.3, type: 'lowpass' }); break;
    case 'blip': tone(a, 880, 0.05, { gain: 0.05 }); break;
    case 'clap': for (let i = 0; i < 14; i++) setTimeout(() => !muted && noiseBurst(a, 0.05, { freq: 1800 + Math.random() * 1500, q: 1.5, gain: 0.12 + Math.random() * 0.1 }), i * 45 + Math.random() * 40); break;
    case 'jingle': [523, 659, 784, 1047].forEach((f, i) => tone(a, f, 0.14, { delay: i * 0.1, gain: 0.07 })); break;
    case 'sad': [392, 330, 262].forEach((f, i) => tone(a, f, 0.18, { delay: i * 0.14, gain: 0.06 })); break;
  }
}

// ---- main.js ----
// Pin High: the game. Title and setup screens, playing a round from behind the
// golfer, the swing meter, the scoreboard panel and the scorecard.


// ---------- Screen ----------

const SW = 512, SH = 288, PANEL = 144, VW = SW - PANEL, VH = SH;
const canvas = document.getElementById('game');
canvas.width = SW; canvas.height = SH;
const ctx = canvas.getContext('2d');
ctx.imageSmoothingEnabled = false;
const view = makeView(VW, VH);

function fit() {
  const k = Math.min(window.innerWidth / SW, window.innerHeight / SH);
  const s = k >= 2 ? Math.floor(k) : k;
  canvas.style.width = `${Math.floor(SW * s)}px`;
  canvas.style.height = `${Math.floor(SH * s)}px`;
  canvas.style.left = `${Math.floor((window.innerWidth - SW * s) / 2)}px`;
  canvas.style.top = `${Math.floor((window.innerHeight - SH * s) / 2)}px`;
}
window.addEventListener('resize', fit);
fit();

// ---------- Settings ----------

const DIFFICULTY = [
  { name: 'NOVICE', tol: 0.06, wind: 0, rise: 1.35, note: 'NO WIND, FORGIVING SNAP' },
  { name: 'AMATEUR', tol: 0.035, wind: 1, rise: 1.1, note: 'WIND, FAIR SNAP' },
  { name: 'PRO', tol: 0.018, wind: 1.25, rise: 0.92, note: 'STRONG WIND, TIGHT SNAP' },
];
const SNAP_LINE = 0.1;
const TEES = [
  { key: 'yellow', name: 'FORWARD' }, { key: 'white', name: 'WHITE' }, { key: 'blue', name: 'BLUE' }, { key: 'black', name: 'CHAMPIONSHIP' },
];
const HOLE_SETS = [{ name: '18 HOLES', from: 0, n: 18 }, { name: 'FRONT 9', from: 0, n: 9 }, { name: 'BACK 9', from: 9, n: 9 }];
const NAMED = Object.values(COURSE_LIST).flat();
const STYLE_KEYS = Object.keys(STYLE_NAMES);
const PUTT_RANGES = [3, 6, 12, 22, 36]; // yards: 9, 18, 36, 66 and 108 feet

const NAME_A = ['BRAMBLE', 'KESTREL', 'ALDER', 'HOLLOWAY', 'MARSHFIELD', 'CRANLEIGH', 'PEBBLEWICK', 'THORNBY', 'ASHCOMBE', 'WILLOWMERE',
  'STAGSHEAD', 'FOXGLOVE', 'HARTWELL', 'LARKSPUR', 'BIRCHAM', 'OTTERBURN', 'REDCLIFFE', 'SILVERDALE', 'MOSSLEY', 'FENWICK',
  'GREYSTONE', 'HAWKRIDGE', 'BLACKWATER', 'SANDHURST', 'WHITLOCK', 'MERRIVALE', 'CORRAN', 'DUNMORE', 'ELMHURST', 'KINGSMEAD'];
const NAME_B = { parkland: 'PARK', links: 'LINKS', desert: 'CANYON', heathland: 'HEATH', alpine: 'PEAKS', tropical: 'BAY', woodland: 'WOODS', stadium: 'NATIONAL' };
const randomCourseName = (style, seed) => `${NAME_A[seed % NAME_A.length]} ${NAME_B[style]}`;

const game = {
  mode: 'loading', art: null, t: 0,
  setup: {
    count: 1, players: [{ name: 'PLAYER 1', shirt: 0 }, { name: 'PLAYER 2', shirt: 1 }, { name: 'PLAYER 3', shirt: 2 }, { name: 'PLAYER 4', shirt: 3 }],
    difficulty: 1, course: 0, style: 0, seed: 1 + Math.floor(Math.random() * 99999), holes: 0, tee: 1, row: 0, editing: -1,
  },
  showCard: false, hints: true,
};

// ---------- Course and holes ----------

function courseDef() {
  const st = game.setup;
  if (st.course === 0) {
    const style = STYLE_KEYS[st.style];
    return { name: randomCourseName(style, st.seed), style, seed: st.seed, par: 72, length: 'standard', tour: 'tour' };
  }
  const c = NAMED[st.course - 1];
  return { name: c.name, style: c.style, seed: c.seed, par: c.par, length: c.length, tour: c.tour };
}

function startRound() {
  const st = game.setup;
  game.mode = 'loadhole';
  game.loadingText = 'BUILDING COURSE';
  setTimeout(() => {
    const def = courseDef();
    game.course = buildCourse(def);
    game.look = lookFor(def.style);
    game.backdrop = game.art.backdrops[def.style] ?? game.art.backdrops.parkland;
    game.weather = roundWeather(game.course, 1);
    const hs = HOLE_SETS[st.holes];
    game.holeList = Array.from({ length: hs.n }, (_, i) => hs.from + i);
    game.holeIdx = 0;
    game.diff = DIFFICULTY[st.difficulty];
    game.tee = TEES[st.tee].key;
    game.players = st.players.slice(0, st.count).map((p, i) => ({ name: p.name.trim() || `PLAYER ${i + 1}`, shirt: p.shirt, scores: [] }));
    game.honour = game.players.map((_, i) => i);
    game.rng = mulberry(def.seed * 7 + 13);
    loadHole();
  }, 30);
}

function mulberry(a) {
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function loadHole() {
  game.mode = 'loadhole';
  const n = game.holeList[game.holeIdx];
  game.loadingText = `HOLE ${n + 1}`;
  setTimeout(() => {
    const hole = game.course.holes[n];
    game.hole = hole;
    game.world = buildWorld(hole, game.look);
    game.minimap = makeMinimap(game.world);
    // This hole's wind, in hole coordinates (yards / s), a little different hole to hole.
    const w = holeWind(game.weather, hole);
    const gust = 0.75 + 0.5 * hash2(n, game.course.seed, 3);
    const k = game.diff.wind * gust;
    game.windMph = Math.round(Math.hypot(w.across, w.along) * k);
    game.wind = { x: w.across * k * MPH, y: w.along * k * MPH };
    const tee = pointAt(hole.line, hole.tees[game.tee]);
    const teeYards = Math.round(hole.length - hole.tees[game.tee]);
    game.holeYards = teeYards;
    for (const p of game.players) {
      p.ball = { x: tee.x, y: tee.y };
      p.strokes = 0; p.holed = false; p.lie = 'tee';
    }
    game.mode = 'play';
    game.cur = -1;
    game.banner = { title: `HOLE ${n + 1}`, sub: `PAR ${hole.par}  ${teeYards} YARDS`, t: 2.6 };
    nextTurn(true);
  }, 30);
}

const pinOf = () => game.hole.pin;
const distTo = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);

// Who plays next: anyone yet to tee off (in honour order), then whoever is farthest from the pin.
function nextTurn(first = false) {
  const left = game.players.map((p, i) => i).filter((i) => !game.players[i].holed);
  if (!left.length) return holeFinished();
  let next = game.honour.find((i) => left.includes(i) && game.players[i].strokes === 0);
  if (next === undefined) next = left.reduce((a, b) => (distTo(game.players[b].ball, pinOf()) > distTo(game.players[a].ball, pinOf()) ? b : a));
  const prevCam = game.cam;
  game.cur = next;
  setupShot();
  if (!first && prevCam) startFly(prevCam, game.shotCam);
  else { game.cam = { ...game.shotCam }; game.phase = 'aim'; game.dirty = true; }
}

// Pick a club and aim for the current player's ball.
function setupShot() {
  const p = game.players[game.cur];
  const lie = lieAt(game.world, p.ball.x, p.ball.y);
  p.lie = lie;
  const pin = pinOf();
  const d = distTo(p.ball, pin);
  game.putting = lie === 'green';
  let club;
  if (game.putting) club = PUTTER;
  else {
    const lf = lieFactor(lie, p.ball.x, p.ball.y);
    const need = d / lf;
    club = 0;
    for (let i = 0; i < PUTTER; i++) if (CLUBS[i].carry >= need * 0.93) club = i;
    if (club === 0 && lie !== 'tee') club = 1; // no driver off the deck by default
    if (lie === 'bunker') club = Math.max(club, d < 60 ? 11 : 3);
    if (lie === 'trees') club = Math.max(club, 5);
    if (lie === 'fringe' && d < 14) club = PUTTER;
  }
  game.club = club;
  game.puttRange = PUTT_RANGES.findIndex((r) => r >= d * 1.25);
  if (game.puttRange < 0) game.puttRange = PUTT_RANGES.length - 1;
  game.aimYaw = autoAim(p.ball, club);
  game.swing = null;
  game.shotCam = shotCamera(p.ball, game.aimYaw);
}

// Straight at the pin when it's in reach, otherwise along the hole's line.
function autoAim(ball, club) {
  const pin = pinOf();
  const d = distTo(ball, pin);
  const reach = club === PUTTER ? 1e9 : CLUBS[club].carry * 1.1;
  let target = pin;
  if (d > reach) {
    const line = game.hole.line;
    const pr = project(line, ball);
    target = pointAt(line, Math.min(line.length, pr.s + CLUBS[club].carry * 0.95), 0);
  }
  return Math.atan2(target.x - ball.x, target.y - ball.y);
}

function shotCamera(ball, yaw) {
  const putt = game.putting;
  const D = putt ? 2.3 : 3.0, E = putt ? 1.3 : 1.75;
  const cx = ball.x - Math.sin(yaw) * D, cy = ball.y - Math.cos(yaw) * D;
  const gb = groundAt(game.world, ball.x, ball.y), gc = groundAt(game.world, cx, cy);
  return { x: cx, y: cy, eye: Math.max(gb + E, gc + 0.9), yaw, horizon: putt ? 58 : 92, f: 230, ball: { ...ball } };
}

// ---------- Camera moves ----------

function startFly(from, to) {
  const d = Math.hypot(to.x - from.x, to.y - from.y);
  game.fly = { from: { ...from }, to: { ...to }, t: 0, dur: Math.min(2.0, 0.5 + d / 260), lift: Math.min(28, 2 + d * 0.09) };
  game.phase = 'fly';
}

function updateFly(dt) {
  const fl = game.fly;
  fl.t += dt;
  let u = Math.min(1, fl.t / fl.dur);
  const e = u < 0.5 ? 2 * u * u : 1 - (-2 * u + 2) ** 2 / 2;
  let dy = fl.to.yaw - fl.from.yaw;
  while (dy > Math.PI) dy -= 2 * Math.PI;
  while (dy < -Math.PI) dy += 2 * Math.PI;
  const lerp = (a, b) => a + (b - a) * e;
  game.cam = {
    x: lerp(fl.from.x, fl.to.x), y: lerp(fl.from.y, fl.to.y), yaw: fl.from.yaw + dy * e,
    eye: lerp(fl.from.eye, fl.to.eye) + Math.sin(Math.PI * u) * fl.lift,
    horizon: lerp(fl.from.horizon, fl.to.horizon), f: lerp(fl.from.f, fl.to.f),
  };
  const g = groundAt(game.world, game.cam.x, game.cam.y);
  if (game.cam.eye < g + 0.8) game.cam.eye = g + 0.8;
  game.dirty = true;
  if (u >= 1) { game.cam = { ...fl.to }; game.phase = 'aim'; game.fly = null; }
}

// ---------- The swing ----------

function pressSwing() {
  if (game.mode !== 'play') return;
  if (game.phase === 'aim') {
    game.swing = { stage: 1, level: 0, power: 0, snap: 0, t: 0 };
    game.phase = 'swing';
    game.hints = false;
    return;
  }
  if (game.phase !== 'swing') return;
  const s = game.swing;
  if (s.stage === 1) { s.power = s.level; s.stage = 2; sfx('blip'); }
  else if (s.stage === 2) { s.snap = s.level; strike(); }
}

function updateSwing(dt) {
  const s = game.swing;
  if (!s) return;
  s.t += dt;
  if (s.stage === 1) {
    s.level += dt / game.diff.rise;
    if (s.level >= 1.1) { s.level = 1.1; s.power = 1.1; s.stage = 2; }
  } else if (s.stage === 2) {
    s.level -= dt * 2.1;
    if (s.level <= -0.06) { s.level = -0.06; s.snap = -0.06; strike(); }
  } else if (s.stage === 3) {
    s.anim += dt;
    if (s.anim >= 0.09 && !s.launched) { s.launched = true; launch(); }
  }
}

// The snap decides the shape: early (above the line) hooks left, late slices right.
function snapEffect(snapLevel, power) {
  const e = snapLevel - SNAP_LINE;
  const tol = game.diff.tol;
  let eff = Math.sign(e) * Math.max(0, Math.abs(e) - tol) / 0.12;
  eff = Math.max(-1.6, Math.min(1.6, eff));
  if (power > 1) eff += (game.rng() - 0.5) * (power - 1) * 10;
  return eff;
}

function strike() {
  const s = game.swing;
  s.stage = 3; s.anim = 0; s.launched = false;
  sfx(game.club === PUTTER ? 'putt' : 'whoosh');
}

function launch() {
  const p = game.players[game.cur];
  const s = game.swing;
  const eff = snapEffect(s.snap, s.power);
  const from = { ...p.ball };
  let res;
  if (game.club === PUTTER) {
    res = playPutt(game.world, from, { yaw: game.aimYaw, distance: PUTT_RANGES[game.puttRange] * Math.min(1.1, s.power), snap: { push: -eff * 0.02, tilt: 0 }, rng: game.rng });
    sfx('putt');
  } else {
    res = playShot(game.world, from, {
      club: CLUBS[game.club], power: Math.min(1.1, s.power), yaw: game.aimYaw,
      snap: { push: -eff * 0.035, tilt: eff * 0.42 }, wind: game.wind, rng: game.rng, lie: p.lie,
    });
    sfx('hit');
  }
  game.flight = { res, from, i: 0, t: 0, eff, power: s.power, done: false, sounds: { tree: false, land: false } };
  game.phase = 'flight';
}

function updateFlight(dt) {
  const fl = game.flight;
  fl.t += dt;
  const speed = game.keysDown.has(' ') ? 3 : 1;
  fl.i = Math.min(fl.res.path.length - 1, fl.i + dt * 60 * speed);
  const k = Math.floor(fl.i);
  if (!fl.sounds.land && fl.res.landed && k > 2) {
    const p = fl.res.path[k];
    if (distTo(p, fl.res.landed) < 0.5 && p.z - groundAt(game.world, p.x, p.y) < 0.2) { fl.sounds.land = true; if (lieAt(game.world, p.x, p.y) !== 'water') sfx('thud'); }
  }
  if (fl.i >= fl.res.path.length - 1 && !fl.done) {
    fl.done = true;
    shotOver();
  }
}

const SCORE_NAMES = { '-4': 'CONDOR!', '-3': 'ALBATROSS!', '-2': 'EAGLE!', '-1': 'BIRDIE!', 0: 'PAR', 1: 'BOGEY', 2: 'DOUBLE BOGEY', 3: 'TRIPLE BOGEY' };

function shotOver() {
  const p = game.players[game.cur];
  const fl = game.flight;
  const res = fl.res;
  p.strokes++;
  let title = '', sub = '';
  const yards = Math.round(distTo(fl.from, res.end));
  if (res.result === 'holed') {
    p.holed = true; p.ball = { ...pinOf() };
    const diff = p.strokes - game.hole.par;
    title = p.strokes === 1 ? 'HOLE IN ONE!' : SCORE_NAMES[diff] ?? (diff > 0 ? `+${diff}` : `${diff}`);
    sub = `${p.strokes} ${p.strokes === 1 ? 'STROKE' : 'STROKES'}`;
    sfx('cup');
    if (diff < 0 || p.strokes === 1) setTimeout(() => sfx('clap'), 300);
  } else if (res.result === 'water') {
    p.strokes++;
    p.ball = dropFromWater(game.world, res.path, fl.from);
    title = 'WATER HAZARD'; sub = 'ONE STROKE PENALTY';
    sfx('splash');
  } else if (res.result === 'oob') {
    p.strokes++;
    p.ball = { ...fl.from };
    title = 'OUT OF BOUNDS'; sub = 'STROKE AND DISTANCE';
    sfx('sad');
  } else {
    p.ball = { ...res.end };
    const lie = lieAt(game.world, p.ball.x, p.ball.y);
    const left = distTo(p.ball, pinOf());
    title = LIE_NAMES[lie] ?? lie.toUpperCase();
    if (lie === 'green') sub = `${Math.round(left * 3)} FEET TO THE HOLE`;
    else sub = `${yards} YARDS  ${Math.round(left)} TO GO`;
    if (res.hitTree) { title = 'HIT A TREE!'; sub = `${LIE_NAMES[lie] ?? lie}, ${Math.round(left)} TO GO`; }
  }
  // Give up after ten.
  if (!p.holed && p.strokes >= 10) { p.holed = true; p.strokes = 10; title = 'PICKED UP'; sub = 'TEN STROKES'; }
  if (p.holed) p.scores[game.holeIdx] = p.strokes;
  game.banner = { title, sub, t: 2.2, color: res.result === 'holed' ? '#ffd84a' : res.result === 'rest' ? '#f4f0e0' : '#ff7a6a' };
  game.phase = 'result';
  game.resultT = res.result === 'holed' ? 2.4 : 1.6;
}

function holeFinished() {
  game.phase = 'done';
  // Honour: best score on this hole tees off first next time.
  game.honour = [...game.honour].sort((a, b) => game.players[a].scores[game.holeIdx] - game.players[b].scores[game.holeIdx]);
  game.showCard = true;
  game.cardWait = true;
  sfx('jingle');
}

function continueAfterCard() {
  game.showCard = false;
  game.cardWait = false;
  if (game.holeIdx + 1 >= game.holeList.length) { game.mode = 'final'; sfx('clap'); return; }
  game.holeIdx++;
  game.cam = null;
  loadHole();
}

// ---------- Scores ----------

function parFor(i) { return game.course.holes[game.holeList[i]].par; }
function toPar(p) {
  let t = 0;
  p.scores.forEach((s, i) => { if (s != null) t += s - parFor(i); });
  return t;
}
const parText = (v) => (v === 0 ? 'E' : v > 0 ? `+${v}` : `${v}`);

// ---------- Minimap ----------

function makeMinimap(w) {
  const MW = 136, MH = 92;
  // Only the ground that matters: the hole's own extent, not all the woods.
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  for (let j = 0; j < w.ny; j += 2) for (let i = 0; i < w.nx; i += 2) {
    const s = w.surf[j * w.nx + i];
    if (s !== 0 && s !== 9 && s !== 12) { x0 = Math.min(x0, i); x1 = Math.max(x1, i); y0 = Math.min(y0, j); y1 = Math.max(y1, j); }
  }
  x0 -= 8; x1 += 8; y0 -= 8; y1 += 8;
  const scale = Math.min(MW / (x1 - x0), MH / (y1 - y0));
  const c = document.createElement('canvas');
  c.width = MW; c.height = MH;
  const g = c.getContext('2d');
  const img = g.createImageData(MW, MH);
  const px = new Uint32Array(img.data.buffer);
  const ox = (MW - (x1 - x0) * scale) / 2, oy = (MH - (y1 - y0) * scale) / 2;
  const colours = SURF_NAMES.map((n) => w.look.ground[n] ?? w.look.ground.rough);
  for (let my = 0; my < MH; my++) for (let mx = 0; mx < MW; mx++) {
    const i = Math.floor(x0 + (mx - ox) / scale), j = Math.floor(y1 - (my - oy) / scale);
    let s = 12;
    if (i >= 0 && j >= 0 && i < w.nx && j < w.ny) s = w.surf[j * w.nx + i];
    const [r, gg, b] = colours[s];
    const dim = s === 0 || s === 9 || s === 12 ? 0.55 : 1;
    px[my * MW + mx] = s === 12 ? 0xff1c1a14 : pack(r * dim, gg * dim, b * dim);
  }
  g.putImageData(img, 0, 0);
  return {
    canvas: c, W: MW, H: MH,
    toMap: (p) => ({ x: ox + (p.x - w.x0 - x0) * scale, y: oy + (y1 - (p.y - w.y0)) * scale }),
  };
}

// ---------- Drawing ----------

function drawScene() {
  const cam = game.cam;
  const w = game.world;
  const p = game.players[game.cur];
  if (game.dirty) {
    const clearAt = game.phase === 'fly' ? game.fly.to.ball : p.ball;
    renderScene(view, w, cam, { backdrop: game.backdrop, sprites: game.art.sprites }, { grid: game.putting && game.phase !== 'fly', clear: { x: clearAt.x, y: clearAt.y, r: 4.5 } });
    game.dirty = false;
  }
  restoreScene(view);
  const pin = pinOf();
  const gp = groundAt(w, pin.x, pin.y);
  // The cup.
  const cup = project3(cam, VW, pin.x, pin.y, gp);
  if (cup) fillEllipse(view, cup.x, cup.y, Math.max(1, (CUP_R * cam.f) / cup.t), Math.max(0.6, (CUP_R * cam.f) / cup.t * 0.4), 0xff101410, cup.t);
  // The flag (lifted out while a putt is close).
  drawSprite(view, cam, game.art.sprites.flag, pin.x, pin.y, gp, 2.6, false, w.look.haze);
  // Other balls at rest.
  game.players.forEach((q, i) => {
    if (q.holed) return;
    if (i === game.cur && (game.phase === 'flight' || game.phase === 'aim' || game.phase === 'swing')) return;
    drawBall(view, cam, q.ball.x, q.ball.y, groundAt(w, q.ball.x, q.ball.y), groundAt(w, q.ball.x, q.ball.y), { shadow: false });
  });
  // The aim marker: where a full shot with this club would carry, on calm flat ground.
  if (game.phase === 'aim' || game.phase === 'swing') {
    drawAimMarker();
    if (!(game.phase === 'swing' && game.swing.stage === 3 && game.swing.launched)) {
      drawBall(view, cam, p.ball.x, p.ball.y, groundAt(w, p.ball.x, p.ball.y), groundAt(w, p.ball.x, p.ball.y));
    }
  }
  if (game.phase === 'flight' || game.phase === 'result') {
    const fl = game.flight;
    const path = fl.res.path;
    const k = Math.min(path.length - 1, Math.floor(fl.i));
    // A faint trail.
    for (let j = Math.max(0, k - 90); j < k; j += 3) {
      const q = path[j];
      const sp = project3(cam, VW, q.x, q.y, q.z);
      if (sp && sp.x >= 0 && sp.x < VW && sp.y >= 0 && sp.y < VH) {
        const pi = Math.floor(sp.y) * VW + Math.floor(sp.x);
        if (view.depth[pi] > sp.t) view.px[pi] = pack(255, 255, 255);
      }
    }
    const q = path[k];
    if (!(game.phase === 'result' && fl.res.result !== 'rest')) drawBall(view, cam, q.x, q.y, q.z, groundAt(w, q.x, q.y));
  }
  ctx.putImageData(view.img, 0, 0);
  // The golfer.
  if ((game.phase === 'aim' || game.phase === 'swing' || game.phase === 'flight' || game.phase === 'result') && game.cur >= 0) {
    drawGolfer(p);
  }
}

function drawAimMarker() {
  const cam = game.cam, w = game.world;
  const p = game.players[game.cur];
  let d;
  if (game.club === PUTTER) d = Math.min(distTo(p.ball, pinOf()), PUTT_RANGES[game.puttRange]);
  else d = CLUBS[game.club].carry * lieFactor(p.lie, p.ball.x, p.ball.y);
  const ax = p.ball.x + Math.sin(game.aimYaw) * d, ay = p.ball.y + Math.cos(game.aimYaw) * d;
  const az = groundAt(w, ax, ay);
  const sp = project3(cam, VW, ax, ay, az);
  if (!sp) return;
  const r = Math.max(2, Math.min(10, (1.6 * cam.f) / sp.t));
  const col = 0xff40e8ff;
  for (let a = 0; a < 16; a++) {
    const th = (a / 16) * Math.PI * 2;
    const x = Math.round(sp.x + Math.cos(th) * r), y = Math.round(sp.y + Math.sin(th) * r * 0.45);
    if (x >= 0 && x < VW && y >= 0 && y < VH && (a & 1) === 0) view.px[y * VW + x] = col;
  }
  for (let k = -2; k <= 2; k++) {
    const x = Math.round(sp.x + k), y = Math.round(sp.y);
    if (x >= 0 && x < VW && y >= 0 && y < VH) view.px[y * VW + x] = col;
    const y2 = Math.round(sp.y + k), x2 = Math.round(sp.x);
    if (x2 >= 0 && x2 < VW && y2 >= 0 && y2 < VH) view.px[y2 * VW + x2] = col;
  }
  // On the green, novices get a dotted line to aim along.
  if (game.club === PUTTER && game.setup.difficulty === 0) {
    for (let s = 0.4; s < d; s += 0.35) {
      const x = p.ball.x + Math.sin(game.aimYaw) * s, y = p.ball.y + Math.cos(game.aimYaw) * s;
      const q = project3(cam, VW, x, y, groundAt(w, x, y));
      if (q && q.x >= 0 && q.x < VW && q.y >= 0 && q.y < VH) fillEllipse(view, q.x, q.y, 0.8, 0.8, 0xffffffff, q.t - 0.02);
    }
  }
}

function golferFrame() {
  const s = game.swing;
  const putt = game.club === PUTTER;
  if (putt) {
    const seq = game.art.putt;
    if (!s || game.phase === 'aim') return seq[0];
    if (s.stage === 1 || s.stage === 2) return seq[Math.min(seq.length - 1, Math.round((s.stage === 1 ? s.level : s.power) * 4))];
    const back = Math.round(s.power * 4);
    const k = Math.max(0, back - Math.floor((s.anim + (game.phase !== 'swing' ? 1 : 0)) * 40));
    return seq[Math.min(seq.length - 1, k)];
  }
  const seq = game.art.swing;
  if (!s || game.phase === 'aim') return seq[0];
  if (s.stage === 1) return seq[Math.min(8, Math.round(s.level * 7.3))];
  if (s.stage === 2) return seq[Math.min(8, Math.round(s.power * 7.3))];
  // Down and through.
  const t = s.anim + (game.flight ? game.flight.t : 0);
  return seq[Math.min(seq.length - 1, 9 + Math.floor(t / 0.07))];
}

function drawGolfer(p) {
  const cam = game.cam;
  const w = game.world;
  const b = project3(cam, VW, p.ball.x, p.ball.y, groundAt(w, p.ball.x, p.ball.y));
  const frames = game.art.golferFor(p.shirt);
  const key = golferFrame();
  const im = frames[key];
  if (!b || !im) return;
  const [bx, by] = game.art.ball;
  // The clubhead sits just behind the ball.
  const x = Math.round(b.x - bx + 2), y = Math.round(b.y - by + 2);
  ctx.drawImage(im, x, y);
}

    const tp = toPar(q);
    smallText(ctx, parText(tp), X + PANEL - 8, y, tp < 0 ? C.red : tp > 0 ? C.cyan : C.text, { align: 'right' });
    y += 10;
  });
  y += 1;

  ctx.strokeStyle = C.edge;

  const pc = game.players[game.cur];
  if (pc && (game.phase === 'aim' || game.phase === 'swing')) {
    const a = mm.toMap(pc.ball);

    const t = mm.toMap({ x: pc.ball.x + Math.sin(game.aimYaw) * d, y: pc.ball.y + Math.cos(game.aimYaw) * d });
    ctx.strokeStyle = 'rgba(92,232,255,0.8)';
    ctx.beginPath(); ctx.moveTo(X + 4 + a.x, my + a.y); ctx.lineTo(X + 4 + t.x, my + t.y); ctx.stroke();
  }

  });

    bigText(ctx, clubName, X + 8, y, C.gold);

    const rise = groundAt(game.world, pinOf().x, pinOf().y) - groundAt(game.world, pc.ball.x, pc.ball.y);

function drawWind(cx, cy) {
  smallText(ctx, 'WIND', cx - 18, cy - 15, C.dim);
  ctx.strokeStyle = '#3a4068';
  ctx.beginPath(); ctx.arc(cx + 0.5, cy + 0.5, 11, 0, Math.PI * 2); ctx.stroke();
  const mph = game.windMph;
  smallText(ctx, mph ? `${mph} MPH` : 'CALM', cx, cy + 15, C.text, { align: 'center' });
  if (!mph || !game.cam) return;
  const a = camAxes(game.cam);
  const wf = game.wind.x * a.fx + game.wind.y * a.fy, wr = game.wind.x * a.rx + game.wind.y * a.ry;
  const m = Math.hypot(wf, wr) || 1;
  const ux = wr / m, uy = -wf / m;
  ctx.strokeStyle = C.cyan; ctx.fillStyle = C.cyan;
  ctx.beginPath(); ctx.moveTo(cx + 0.5 - ux * 8, cy + 0.5 - uy * 8); ctx.lineTo(cx + 0.5 + ux * 8, cy + 0.5 + uy * 8); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(cx + 0.5 + ux * 10, cy + 0.5 + uy * 10);
  ctx.lineTo(cx + 0.5 + ux * 5 - uy * 4, cy + 0.5 + uy * 5 + ux * 4);
  ctx.lineTo(cx + 0.5 + ux * 5 + uy * 4, cy + 0.5 + uy * 5 - ux * 4);
  ctx.fill();
}

// The power and snap meter: a bar that fills as you swing back, then falls to the snap line.
function drawMeter(x, y) {
  const H = 62, W = 10, top = y, bottom = y + H;
  const lv = (v) => bottom - (v / 1.1) * H;
  ctx.fillStyle = '#0c0e18'; ctx.fillRect(x - 2, top - 2, W + 4, H + 4);
  ctx.fillStyle = '#2a2f4a'; ctx.fillRect(x, top, W, H);
  ctx.fillStyle = '#5a2430'; ctx.fillRect(x, top, W, lv(1) - top);
  for (let k = 1; k <= 10; k++) { ctx.fillStyle = k === 10 ? '#f4f0e0' : '#4a5078'; ctx.fillRect(x - 3, Math.round(lv(k / 10)), k % 5 ? 3 : 5, 1); }
  // Snap zone.
  const tol = game.diff ? game.diff.tol : 0.035;
  ctx.fillStyle = '#2f8a46';
  ctx.fillRect(x, Math.round(lv(SNAP_LINE + tol)), W, Math.max(1, Math.round(lv(SNAP_LINE - tol) - lv(SNAP_LINE + tol))));
  ctx.fillStyle = '#7ee07a'; ctx.fillRect(x - 2, Math.round(lv(SNAP_LINE)), W + 4, 1);
  const s = game.swing;
  if (s) {
    if (s.stage === 1) {
      ctx.fillStyle = s.level > 1 ? '#ff6a5a' : '#ffd84a';
      ctx.fillRect(x + 1, Math.round(lv(s.level)), W - 2, bottom - Math.round(lv(s.level)));
    } else {
      ctx.fillStyle = s.power > 1 ? '#c85048' : '#a88a2a';
      ctx.fillRect(x + 1, Math.round(lv(s.power)), W - 2, bottom - Math.round(lv(s.power)));
      const mk = s.stage === 2 ? s.level : s.snap;
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x - 3, Math.round(lv(Math.max(-0.05, mk))), W + 6, 2);
    }
  }
  // Putts: where the hole is on the bar, as if the green were flat.
  if (game.club === PUTTER && game.cur >= 0) {
    const d = distTo(game.players[game.cur].ball, pinOf()) / PUTT_RANGES[game.puttRange];
    if (d <= 1.1) { ctx.fillStyle = '#ff3a3a'; ctx.fillRect(x + W + 1, Math.round(lv(d)) - 1, 4, 3); }
  }
  smallText(ctx, 'POWER', x + W + 8, top + 2, C.text);
  const pw = s ? Math.round((s.stage === 1 ? s.level : s.power) * 100) : null;
  if (pw != null) smallText(ctx, `${pw}%`, x + W + 8, top + 10, pw > 100 ? C.red : C.gold);
  smallText(ctx, 'SNAP', x + W + 8, Math.round(lv(SNAP_LINE)) - 2, C.green);
  if (s && s.stage === 3) {
    const e = snapEffect(s.snap, 1);
    const txt = Math.abs(e) < 0.01 ? 'PURE' : e > 0 ? (e > 0.6 ? 'HOOK' : 'DRAW') : (e < -0.6 ? 'SLICE' : 'FADE');
    if (game.club !== PUTTER || Math.abs(e) >= 0.01) smallText(ctx, txt, x + W + 8, Math.round(lv(SNAP_LINE)) + 6, C.cyan);
  }
  smallText(ctx, game.club === PUTTER ? 'STROKE' : 'SWING', x - 50, top + 2, C.dim);
  smallText(ctx, 'SPACE', x - 50, top + 10, C.dim);
  smallText(ctx, 'OR CLICK', x - 50, top + 17, C.dim);
}

function drawScorecard() {
  const players = game.players;

  const rowH = 9;
  const h = 26 + nine.length * (rowH * (players.length + 2) + 6) + 14;
  const w = VW - 16;
  const x0 = 8, y0 = Math.max(4, Math.round((VH - h) / 2));

  smallText(ctx, game.course.name, x0 + w / 2, y0 + 16, C.dim, { align: 'center' });
  let y = y0 + 26;
  const colW = 24, nameW = 52;
  nine.forEach((set) => {
    smallText(ctx, 'HOLE', x0 + 6, y, C.dim);
    set.forEach((hn, k) => smallText(ctx, `${hn + 1}`, x0 + nameW + k * colW + 8, y, C.dim, { align: 'center' }));
    smallText(ctx, 'TOT', x0 + nameW + 9 * colW + 10, y, C.dim, { align: 'center' });
    y += rowH;
    smallText(ctx, 'PAR', x0 + 6, y, C.dim);
    let pt = 0;
    set.forEach((hn, k) => { const par = game.course.holes[hn].par; pt += par; smallText(ctx, `${par}`, x0 + nameW + k * colW + 8, y, C.text, { align: 'center' }); });
    smallText(ctx, `${pt}`, x0 + nameW + 9 * colW + 10, y, C.text, { align: 'center' });
    y += rowH;
    players.forEach((p) => {
      const [r, g, b] = SHIRTS[p.shirt].rgb;
      ctx.fillStyle = `rgb(${r},${g},${b})`;
      ctx.fillRect(x0 + 4, y, 3, 5);
      smallText(ctx, p.name.slice(0, 10), x0 + 10, y, C.text);
      let tot = 0, any = false;
      set.forEach((hn, k) => {
        const idx = holes.indexOf(hn);
        const s = p.scores[idx];
        if (s == null) return;
        any = true; tot += s;
        const par = game.course.holes[hn].par;
        const cx = x0 + nameW + k * colW + 8;
        if (s < par) { ctx.strokeStyle = C.red; ctx.beginPath(); ctx.arc(cx + 0.5, y + 2.5, 5, 0, Math.PI * 2); ctx.stroke(); }
        if (s > par) { ctx.strokeStyle = C.cyan; ctx.strokeRect(cx - 4.5, y - 2.5, 10, 10); }
        smallText(ctx, `${s}`, cx, y, s < par ? C.red : C.text, { align: 'center' });
      });
      if (any) smallText(ctx, `${tot}`, x0 + nameW + 9 * colW + 10, y, C.gold, { align: 'center' });
      y += rowH;
    });
    y += 6;
  });
  // Totals to par.
  const parts = players.map((p) => `${p.name.slice(0, 10)} ${parText(toPar(p))}`).join('   ');
  smallText(ctx, parts, x0 + w / 2, y, C.gold, { align: 'center' });
  if (game.cardWait) smallText(ctx, 'SPACE OR CLICK TO CONTINUE', x0 + w / 2, y0 + h - 9 + 12 > VH ? y0 + h - 9 : y0 + h + 3, C.text, { align: 'center' });
}

// A slowly turning view of a showpiece hole behind the menus.
function setupShowcase() {
  const course = buildCourse({ name: 'SHOWCASE', style: 'parkland', par: 72, length: 'standard', seed: 1986 });
  const hole = course.holes[1];
  const look = lookFor('parkland');
  game.show = { world: buildWorld(hole, look), hole, yaw: 0, backdrop: game.art.backdrops.parkland };
}

const showView = makeView(SW, SH);
function drawShowcase(dt) {
  const s = game.show;
  // Glide down the fairway towards the green, over and over.
  s.u = ((s.u ?? 0) + dt / 40) % 1;
  const line = s.hole.line;
  const at = pointAt(line, 40 + s.u * (line.length - 170), 0);
  const pin = s.hole.pin;
  const yaw = Math.atan2(pin.x - at.x, pin.y - at.y) + Math.sin(game.t * 0.15) * 0.25;
  const cam = { x: at.x, y: at.y, yaw, eye: groundAt(s.world, at.x, at.y) + 7, horizon: 110, f: 280 };
  renderScene(showView, s.world, cam, { backdrop: s.backdrop, sprites: game.art.sprites }, {});
  drawSprite(showView, cam, game.art.sprites.flag, pin.x, pin.y, groundAt(s.world, pin.x, pin.y), 2.6, false, s.world.look.haze);
  ctx.putImageData(showView.img, 0, 0);
}

function drawTitle(dt) {
  drawShowcase(dt);
  ctx.fillStyle = 'rgba(10,12,24,0.45)';
  ctx.fillRect(0, 0, SW, SH);
  bigText(ctx, 'PIN HIGH', SW / 2, 64, C.gold, { scale: 5, align: 'center', shadow: '#1a1206' });
  bigText(ctx, 'RETRO GOLF FROM BEHIND THE BALL', SW / 2, 112, C.text, { align: 'center' });
  if (Math.floor(game.t * 2) % 2 === 0) bigText(ctx, 'PRESS SPACE OR CLICK TO PLAY', SW / 2, 190, '#ffffff', { align: 'center' });
  smallText(ctx, 'COURSES FROM THE FAIRWAY PIXELS GENERATOR. ART MADE WITH PIXELLAB.', SW / 2, SH - 12, C.dim, { align: 'center' });
}

function setupRows() {
  const st = game.setup;
  const rows = [{ key: 'count', label: 'PLAYERS', value: `${st.count}` }];
  for (let i = 0; i < st.count; i++) rows.push({ key: 'player', i, label: `PLAYER ${i + 1}`, value: st.editing === i ? `${st.players[i].name}_` : st.players[i].name, shirt: st.players[i].shirt });
  rows.push({ key: 'difficulty', label: 'LEVEL', value: DIFFICULTY[st.difficulty].name, note: DIFFICULTY[st.difficulty].note });
  const named = st.course > 0 ? NAMED[st.course - 1] : null;
  rows.push({ key: 'course', label: 'COURSE', value: named ? named.name : 'RANDOM COURSE', note: named ? `${STYLE_NAMES[named.style]}, ${named.tour.toUpperCase()} LEVEL` : 'A NEW COURSE FROM A SEED' });
  if (!named) {
    rows.push({ key: 'style', label: 'STYLE', value: STYLE_NAMES[STYLE_KEYS[st.style]] });
    rows.push({ key: 'seed', label: 'SEED', value: `${st.seed}`, note: `${randomCourseName(STYLE_KEYS[st.style], st.seed)}  (R: NEW SEED)` });
  }
  rows.push({ key: 'holes', label: 'ROUND', value: HOLE_SETS[st.holes].name });
  rows.push({ key: 'tee', label: 'TEES', value: TEES[st.tee].name });
  rows.push({ key: 'start', label: '', value: 'TEE OFF!' });
  return rows;
}

function changeSetup(row, dir) {
  const st = game.setup;
  const wrap = (v, n) => (v + n) % n;
  switch (row.key) {
    case 'count': st.count = Math.max(1, Math.min(4, st.count + dir)); break;
    case 'player': st.players[row.i].shirt = wrap(st.players[row.i].shirt + dir, SHIRTS.length); break;
    case 'difficulty': st.difficulty = wrap(st.difficulty + dir, DIFFICULTY.length); break;
    case 'course': st.course = wrap(st.course + dir, NAMED.length + 1); break;
    case 'style': st.style = wrap(st.style + dir, STYLE_KEYS.length); break;
    case 'seed': st.seed = Math.max(1, st.seed + dir); break;
    case 'holes': st.holes = wrap(st.holes + dir, HOLE_SETS.length); break;
    case 'tee': st.tee = wrap(st.tee + dir, TEES.length); break;
  }
  sfx('blip');
}

function activateSetup(row) {
  const st = game.setup;
  if (row.key === 'start') { sfx('jingle'); startRound(); }
  else if (row.key === 'player') { st.editing = st.editing === row.i ? -1 : row.i; }
  else if (row.key === 'seed') { st.seed = 1 + Math.floor(Math.random() * 99999); sfx('blip'); }
  else changeSetup(row, 1);
}

const SETUP_Y0 = 50, SETUP_ROW = 17;

  drawShowcase(dt);

  const rows = setupRows();
  const st = game.setup;
  st.row = Math.min(st.row, rows.length - 1);
  rows.forEach((r, i) => {
    const y = SETUP_Y0 + i * SETUP_ROW;
    const sel = i === st.row;
    if (sel) { ctx.fillStyle = 'rgba(255,216,74,0.12)'; ctx.fillRect(60, y - 4, SW - 120, SETUP_ROW - 1); }
    if (r.key === 'start') {
      bigText(ctx, r.value, SW / 2, y, sel ? C.gold : C.text, { align: 'center' });
      return;
    }
    bigText(ctx, r.label, 72, y, sel ? C.gold : C.dim);
    if (r.shirt != null) {
      const [cr, cg, cb] = SHIRTS[r.shirt].rgb;
      ctx.fillStyle = `rgb(${cr},${cg},${cb})`;
      ctx.fillRect(SW - 92, y - 1, 9, 9);
      smallText(ctx, SHIRTS[r.shirt].name, SW - 80, y + 1, C.dim);
    }
    if (sel) { bigText(ctx, '<', 160, y, C.gold); }
    bigText(ctx, r.value, 172, y, C.text);
    if (r.note) smallText(ctx, r.note, 172, y + 9, C.dim);
  });
  const sel = rows[st.row];
  if (sel.key === 'player') smallText(ctx, st.editing === sel.i ? 'TYPE A NAME, ENTER WHEN DONE' : 'ENTER: CHANGE NAME   LEFT/RIGHT: SHIRT COLOUR', SW / 2, SH - 12, C.text, { align: 'center' });
}

function drawFinal(dt) {
  drawShowcase(dt);
  ctx.fillStyle = 'rgba(10,12,24,0.75)';
  ctx.fillRect(0, 0, SW, SH);
  bigText(ctx, 'ROUND OVER', SW / 2, 30, C.gold, { scale: 3, align: 'center' });
  smallText(ctx, game.course.name, SW / 2, 58, C.dim, { align: 'center' });
  const ranked = [...game.players].sort((a, b) => toPar(a) - toPar(b));
  ranked.forEach((p, i) => {
    const y = 80 + i * 22;
    const tot = p.scores.reduce((t, s) => t + (s ?? 0), 0);
    bigText(ctx, `${i + 1}`, 140, y, C.gold, { scale: 2 });
    const [r, g, b] = SHIRTS[p.shirt].rgb;
    ctx.fillStyle = `rgb(${r},${g},${b})`;
    ctx.fillRect(164, y + 2, 8, 10);
    bigText(ctx, p.name, 180, y + 3, C.text);
    bigText(ctx, `${tot}`, 330, y + 3, C.text, { align: 'right' });
    const tp = toPar(p);
    bigText(ctx, parText(tp), 380, y + 3, tp < 0 ? C.red : tp > 0 ? C.cyan : C.text, { align: 'right' });
  });
  if (Math.floor(game.t * 2) % 2 === 0) bigText(ctx, 'SPACE OR CLICK FOR THE CLUBHOUSE', SW / 2, SH - 30, '#ffffff', { align: 'center' });
}

// ---------- Input ----------

game.keysDown = new Set();

function aimBy(d) {
  if (game.mode !== 'play' || game.phase !== 'aim') return;
  game.aimYaw += d;
  game.shotCam = shotCamera(game.players[game.cur].ball, game.aimYaw);
  game.cam = { ...game.shotCam };
  game.dirty = true;
}

function clubBy(d) {
  if (game.mode !== 'play' || game.phase !== 'aim') return;
  if (game.club === PUTTER && game.putting) {
    game.puttRange = Math.max(0, Math.min(PUTT_RANGES.length - 1, game.puttRange - d));
  } else {
    const lie = game.players[game.cur].lie;
    game.club = Math.max(0, Math.min(PUTTER, game.club + d));
    if (game.club === 0 && lie !== 'tee' && lie !== 'fairway' && d < 0) game.club = 1;
  }
  sfx('blip');
}

window.addEventListener('keydown', (e) => {
  const k = e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(k)) e.preventDefault();
  if (game.keysDown.has(k)) return;
  game.keysDown.add(k);
  if (game.mode === 'title') { if (k === ' ' || k === 'Enter') { game.mode = 'setup'; sfx('blip'); } return; }
  if (game.mode === 'setup') return setupKey(e);
  if (game.mode === 'final') { if (k === ' ' || k === 'Enter') game.mode = 'title'; return; }
  if (game.mode !== 'play') return;
  if (k === 'm' || k === 'M') toggleMute();
  if (k === 'Escape') { game.mode = 'title'; return; }
  if (game.cardWait) { if (k === ' ' || k === 'Enter') continueAfterCard(); return; }
  if (k === 'Tab') { game.showCard = !game.showCard; return; }
  if (k === ' ' || k === 'Enter') pressSwing();
  if (k === 'ArrowUp' || k === 'w' || k === 'W') clubBy(-1);
  if (k === 'ArrowDown' || k === 's' || k === 'S') clubBy(1);
});
window.addEventListener('keyup', (e) => game.keysDown.delete(e.key));
window.addEventListener('blur', () => game.keysDown.clear());

function setupKey(e) {
  const st = game.setup;
  const rows = setupRows();
  const row = rows[st.row];
  const k = e.key;
  if (st.editing >= 0) {
    const p = st.players[st.editing];
    if (k === 'Enter' || k === 'Escape') st.editing = -1;
    else if (k === 'Backspace') p.name = p.name.slice(0, -1);
    else if (k.length === 1 && /[a-z0-9 .'&-]/i.test(k) && p.name.length < 12) p.name += k.toUpperCase();
    return;
  }
  if (k === 'ArrowUp') st.row = (st.row + rows.length - 1) % rows.length;
  else if (k === 'ArrowDown') st.row = (st.row + 1) % rows.length;
  else if (k === 'ArrowLeft') changeSetup(row, -1);
  else if (k === 'ArrowRight') changeSetup(row, 1);
  else if (k === 'Enter' || k === ' ') activateSetup(row);
  else if (k === 'r' || k === 'R') { st.seed = 1 + Math.floor(Math.random() * 99999); }
  else if (k === 'Escape') game.mode = 'title';
}

// Pointer: drag sideways on the view to aim, click to swing, wheel for clubs.
const ptr = { down: false, x: 0, y: 0, moved: 0, swingPress: false };
function toScreen(e) {
  const r = canvas.getBoundingClientRect();
  return { x: ((e.clientX - r.left) / r.width) * SW, y: ((e.clientY - r.top) / r.height) * SH };
}
canvas.addEventListener('pointerdown', (e) => {
  const p = toScreen(e);
  ptr.down = true; ptr.x = p.x; ptr.y = p.y; ptr.moved = 0; ptr.swingPress = false;
  canvas.setPointerCapture(e.pointerId);
  if (game.mode === 'play' && !game.cardWait && game.phase === 'swing') { pressSwing(); ptr.swingPress = true; }
});
canvas.addEventListener('pointermove', (e) => {
  if (!ptr.down) return;
  const p = toScreen(e);
  const dx = p.x - ptr.x;
  ptr.moved += Math.abs(dx) + Math.abs(p.y - ptr.y);
  ptr.x = p.x; ptr.y = p.y;
  if (game.mode === 'play' && game.phase === 'aim' && ptr.moved > 3 && ptr.x < VW) aimBy(dx * 0.004);
});
canvas.addEventListener('pointerup', (e) => {
  if (!ptr.down) return;
  ptr.down = false;
  const p = toScreen(e);
  if (ptr.moved > 3 || ptr.swingPress) return;
  if (game.mode === 'title') { game.mode = 'setup'; sfx('blip'); return; }
  if (game.mode === 'final') { game.mode = 'title'; return; }
  if (game.mode === 'setup') return setupClick(p);
  if (game.mode !== 'play') return;
  if (game.cardWait) return continueAfterCard();
  if (p.x >= VW) {
    // Panel: the club name steps through clubs.
    if (p.y > 150 && p.y < 200 && game.phase === 'aim') clubBy(1);
    return;
  }
  if (game.phase === 'aim') pressSwing();
});
canvas.addEventListener('wheel', (e) => { e.preventDefault(); clubBy(e.deltaY > 0 ? 1 : -1); }, { passive: false });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());

function setupClick(p) {
  const st = game.setup;
  if (st.editing >= 0) { st.editing = -1; return; }
  const rows = setupRows();
  const i = Math.floor((p.y - SETUP_Y0 + 4) / SETUP_ROW);
  if (i < 0 || i >= rows.length) return;
  st.row = i;
  const row = rows[i];
  if (row.key === 'start' || (row.key === 'player' && p.x < SW - 96) || (row.key === 'seed' && p.x > SW / 2)) return activateSetup(row);
  changeSetup(row, p.x < 172 ? -1 : 1);
}

// ---------- Main loop ----------

let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  game.t += dt;
  try { step(dt); } catch (err) { console.error(err); }
  requestAnimationFrame(frame);
}

function step(dt) {
  if (game.mode === 'loading') {
    ctx.fillStyle = '#10121c'; ctx.fillRect(0, 0, SW, SH);
    bigText(ctx, 'LOADING', SW / 2, SH / 2, C.gold, { align: 'center' });
    return;
  }
  if (game.mode === 'title') return drawTitle(dt);
  if (game.mode === 'setup') return drawSetup(dt);
  if (game.mode === 'final') return drawFinal(dt);
  if (game.mode === 'loadhole') {
    ctx.fillStyle = '#10121c'; ctx.fillRect(0, 0, VW, VH);
    bigText(ctx, game.loadingText, VW / 2, VH / 2 - 8, C.gold, { scale: 2, align: 'center' });
    smallText(ctx, 'WALKING TO THE TEE...', VW / 2, VH / 2 + 12, C.dim, { align: 'center' });
    drawPanel();
    return;
  }
  // Playing.
  if (game.phase === 'aim') {
    const turn = (game.keysDown.has('Shift') ? 0.12 : 0.5) * dt * (game.putting ? 0.5 : 1);
    if (game.keysDown.has('ArrowLeft') || game.keysDown.has('a') || game.keysDown.has('A')) aimBy(-turn);
    if (game.keysDown.has('ArrowRight') || game.keysDown.has('d') || game.keysDown.has('D')) aimBy(turn);
  }
  if (game.phase === 'swing') updateSwing(dt);
  if (game.phase === 'flight') updateFlight(dt);
  if (game.phase === 'result') {
    if (game.flight && !game.flight.done) updateFlight(dt);
    game.resultT -= dt;
    if (game.resultT <= 0) { game.flight = null; nextTurn(); }
  }
  if (game.phase === 'fly') updateFly(dt);
  if (game.phase === 'flight' && game.flight.done) {}
  drawScene();
  drawBanner(dt);
  drawHints();
  drawPanel();
  if (game.showCard) drawScorecard();
}

loadArt().then((art) => {
  game.art = art;
  window.pinHigh = { game, setupShot, shotCamera, nextTurn };
  setupShowcase();
  game.mode = 'title';
  const q = new URLSearchParams(location.search);
  // ?play=1 jumps straight into a round (handy for testing); ?style= and ?seed= pick a course.
  if (q.has('style')) game.setup.style = Math.max(0, STYLE_KEYS.indexOf(q.get('style')));
  if (q.has('seed')) game.setup.seed = Number(q.get('seed')) || 1;
  if (q.has('level')) game.setup.difficulty = Number(q.get('level'));
  if (q.has('play')) startRound();
});
requestAnimationFrame(frame);

})();
</script>
</body>
